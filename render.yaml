services:
  - type: web
    name: sportscenter-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: JAVA_VERSION
        value: "17"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: sportscenter-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: sportscenter-redis
          property: port
      - key: CORS_ALLOWED_ORIGIN
        sync: false

  - type: keyvalue
    name: sportscenter-redis
    plan: free
    ipAllowList: []
