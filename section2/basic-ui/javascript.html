<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvenOdd</title>
</head>
<body>
    <div id="root"></div>
    <script src=".react-lib/react.deveploment.js"></script>
    <script src=".react-lib/react-dom.deveploment.js"></script>
    <script>
        const randomElement=Math.floor(Math.random()*100)+1;
        let numberElement=document.createElement("h1");
        numberElement.innerHTML=`Generated number ${randomElement}`;
        let evenodd=document.createElement("h2");
        if(randomElement%2==0){
            evenodd.innerHTML="even number";
        }else{
            evenodd.innerHTML="odd number";
        }
        const root = document.getElementById("root");
        root.appendChild(numberElement);
        root.appendChild(evenodd);
        setTimeout(() => {
            console.log("Executed after 2s");
        }, 2000);
    </script>
</body>
</html>
